# CI360 API user credentials. Used by:
#   - SubjectContact, to authenticate its ECR-auth pre-install Job (namespace ci360-shed-hues-sub)
#   - the decision container, to call back into CI360 contact/response APIs at runtime
#     (namespace ci360-shed-hues)
#
# This template defaults to the SubjectContact namespace. Apply it once as-is, then apply
# it again with the namespace swapped to ci360-shed-hues for the decision container — see
# Step 2 / Step 3 in the guide for the exact PowerShell commands.
apiVersion: v1
kind: Secret
metadata:
  name: api-user-secret
  namespace: ci360-shed-hues-sub
type: Opaque
stringData:
  user-id: "${API_USERNAME}"
  user-secret: "${API_PASSWORD}"
