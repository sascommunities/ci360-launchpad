# Database connection details mounted into the decision container at
# /opt/scr/secrets/db (see 06-decision-deployment.yaml). The decision needs BOTH
# databases at once, so db.secrets carries two CONOPTS blocks:
#   1. The customer data PostgreSQL from Step 1 (namespace ci360-shed-hues-pg),
#      schema "TRAINCAT".
#   2. SubjectContact's own built-in PostgreSQL from Step 2 (namespace
#      ci360-shed-hues-sub), database/schema "contactresponse" - reached through
#      its pgpool Service (the HA-safe entry point, not a single postgresql pod).
#
# Substitute all ${VAR} placeholders before applying - see Step 3 (Section 6.2) in the guide:
#
#   $pgHost = "ci360-postgres-postgresql.ci360-shed-hues-pg.svc.cluster.local"
#   $pgPort = "5432"
#   $subjectContactPgHost = "sas-marketing-decisioning-postgresql-ha-pgpool.ci360-shed-hues-sub.svc.cluster.local"
#   $subjectContactPgPassword = kubectl get secret subjectcontact-pg-auth -n ci360-shed-hues-sub -o jsonpath='{.data.password}' | ... base64 decode ...
#
#   (Get-Content manifests\05-db-credentials-secret.yaml -Raw) `
#       -replace '\$\{PG_HOST\}',                     $pgHost `
#       -replace '\$\{PG_DATABASE\}',                 $env:PG_DATABASE `
#       -replace '\$\{PG_USER\}',                     $env:PG_USER `
#       -replace '\$\{PG_PASSWORD\}',                 $env:PG_PASSWORD `
#       -replace '\$\{PG_PORT\}',                     $pgPort `
#       -replace '\$\{SUBJECTCONTACT_PG_HOST\}',      $subjectContactPgHost `
#       -replace '\$\{SUBJECTCONTACT_PG_PASSWORD\}',  $subjectContactPgPassword |
#       kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ci360-shed-hues
type: Opaque
stringData:
  SERVER: "${PG_HOST}"
  DATABASE: "${PG_DATABASE}"
  USERNAME: "${PG_USER}"
  PASSWORD: "${PG_PASSWORD}"
  PORT: "${PG_PORT}"
  db.secrets: |
    connectionstring=DRIVER=SQL; CONOPTS=((DRIVER=POSTGRES; CATALOG=TRAINCAT; UID=${PG_USER}; PWD=${PG_PASSWORD}; SERVER=${PG_HOST}; PORT=${PG_PORT}; DB=${PG_DATABASE}; SCHEMA=TRAINCAT;);(DRIVER=POSTGRES; CATALOG=contactresponse; UID=postgres; PWD=${SUBJECTCONTACT_PG_PASSWORD}; SERVER=${SUBJECTCONTACT_PG_HOST}; PORT=5432; DB=contactresponse; SCHEMA=contactresponse;))