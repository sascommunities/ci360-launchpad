# Holds the CI360 tenant credentials used by SubjectContact to request access tokens
# from the CI360 API gateway (needed by its pre-install ECR-auth Job).
#
# Substitute all ${VAR} placeholders before applying — see Step 2 in the guide for the
# PowerShell snippet that does this for you:
#
#   (Get-Content manifests\02-access-point-secret.yaml -Raw) `
#       -replace '\$\{TENANT_ID\}',     $env:TENANT_ID `
#       -replace '\$\{CLIENT_SECRET\}', $env:CLIENT_SECRET `
#       -replace '\$\{TENANT_URL\}',    $env:TENANT_URL |
#       kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: access-point-secret
  namespace: ci360-shed-hues-sub
type: Opaque
stringData:
  tenant-id: "${TENANT_ID}"
  client-secret: "${CLIENT_SECRET}"
  token-url: "${TENANT_URL}/token"
  final-url: "${TENANT_URL}"
