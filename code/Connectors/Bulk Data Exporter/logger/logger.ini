[loggers]
keys = root

[handlers]
keys = rotatingFileHandler, streamHandler

[formatters]
keys = simpleFmt

[logger_root]
level = INFO
handlers = rotatingFileHandler, streamHandler

[handler_rotatingFileHandler]
class = handlers.RotatingFileHandler
level = INFO
formatter = simpleFmt
; 10MB size limit, 7 backup files
args = ('logs/BulkCustomTaskDataExportApplication.log', 'a', 10485760, 7, 'utf-8')

[handler_streamHandler]
level = INFO
class = StreamHandler
formatter = simpleFmt
args = (sys.stdout,)

[formatter_simpleFmt]
format = %(asctime)s %(pathname)s(%(lineno)d): %(levelname)s %(message)s
